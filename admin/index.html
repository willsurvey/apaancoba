<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>📊 Admin Panel - Bot Saham</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: white;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }
    h1 { text-align: center; margin-bottom: 10px; color: #333; }
    .subtitle { text-align: center; color: #666; margin-bottom: 30px; }
    
    .tabs { display: flex; border-bottom: 2px solid #eee; margin-bottom: 20px; }
    .tab { flex: 1; text-align: center; padding: 12px; cursor: pointer; font-weight: 600; color: #666; transition: 0.2s; }
    .tab:hover { background: #f9f9f9; }
    .tab.active { color: #667eea; border-bottom: 2px solid #667eea; margin-bottom: -2px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    
    .form-group { margin-bottom: 20px; }
    label { display: block; margin-bottom: 8px; font-weight: 600; color: #333; }
    input, textarea {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #e0e0e0;
      border-radius: 8px;
      font-size: 14px;
      transition: border-color 0.3s;
    }
    input:focus, textarea:focus { outline: none; border-color: #667eea; }
    textarea { resize: vertical; min-height: 80px; }
    .file-input { padding: 10px; background: #f5f5f5; border-radius: 8px; }
    button {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4); }
    button:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }
    
    .stats {
      background: #f5f5f5;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      text-align: center;
    }
    .stats span { display: inline-block; margin: 0 15px; font-weight: 600; color: #667eea; }
    .result { margin-top: 20px; padding: 15px; border-radius: 8px; display: none; }
    .result.success { background: #d4edda; color: #155724; display: block; }
    .result.error { background: #f8d7da; color: #721c24; display: block; }
    .info {
      background: #e7f3ff;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      color: #0066cc;
      margin-bottom: 20px;
    }

    /* List Users */
    .list-container { max-height: 400px; overflow-y: auto; border: 1px solid #eee; border-radius: 8px; }
    .list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #eee; }
    .list-item:last-child { border-bottom: none; }
    .list-item.blocked { background: #fff0f0; }
    .item-info { display: flex; flex-direction: column; }
    .item-name { font-weight: 600; font-size: 14px; color: #333; }
    .item-meta { font-size: 12px; color: #777; margin-top: 4px; }
    .btn-action { padding: 6px 12px; border-radius: 4px; border: none; font-size: 12px; font-weight: 600; cursor: pointer; color: white; width: auto; }
    .btn-action.block { background: #dc3545; }
    .btn-action.unblock { background: #28a745; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📊 Admin Panel</h1>
    <p class="subtitle">Bot Trading Plan Saham</p>

    <div class="tabs">
      <div class="tab active" onclick="switchTab(event, 'upload')">Broadcast Data</div>
      <div class="tab" onclick="switchTab(event, 'users')">Kelola Pengguna</div>
    </div>

    <!-- TAB 1: UPLOAD -->
    <div id="tab-upload" class="tab-content active">
      <div class="stats">
        <span>👥 User Aktif: <b id="userCount">-</b></span>
        <span>👥 Grup Aktif: <b id="groupCount">-</b></span>
      </div>

      <div class="info">
        ℹ️ <b>Template Excel:</b> Hanya isi Bias, Entry, SL, TP (tanpa nama saham)
      </div>

      <form id="uploadForm">
        <div class="form-group">
          <label for="stockCode">1️⃣ Kode Saham (Wajib)</label>
          <input type="text" id="stockCode" name="stockCode" placeholder="Contoh: GOTO" required>
        </div>

        <div class="form-group">
          <label for="companyName">2️⃣ Nama Perusahaan (Wajib)</label>
          <input type="text" id="companyName" name="companyName" placeholder="Contoh: PT GoTo Gojek Tokopedia" required>
        </div>

        <div class="form-group">
          <label for="excelFile">3️⃣ File Excel Plan (Wajib)</label>
          <input type="file" id="excelFile" name="excelFile" class="file-input" accept=".xlsx,.xls" required>
        </div>

        <div class="form-group">
          <label for="message">💬 Pesan Tambahan (Optional)</label>
          <textarea id="message" name="message" placeholder="Contoh: Semangat trading hari ini! 🚀"></textarea>
        </div>

        <button type="submit" id="submitBtn">🚀 KIRIM KE SEMUA USER</button>
      </form>
      <div class="result" id="result"></div>
    </div>

    <!-- TAB 2: USERS -->
    <div id="tab-users" class="tab-content">
      <h3 style="margin-bottom:10px;">Daftar Pengguna (User)</h3>
      <div class="list-container" id="userList">Loading...</div>
      
      <h3 style="margin-top:20px; margin-bottom:10px;">Daftar Grup</h3>
      <div class="list-container" id="groupList">Loading...</div>
    </div>
  </div>

  <script>
    function switchTab(event, tabId) {
      document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      
      event.target.classList.add('active');
      document.getElementById('tab-' + tabId).classList.add('active');

      if (tabId === 'users') {
        loadUsersList();
      }
    }

    async function loadStats() {
      try {
        const res = await fetch('/api/upload');
        const data = await res.json();
        document.getElementById('userCount').textContent = data.users || 0;
        document.getElementById('groupCount').textContent = data.groups || 0;
      } catch (e) {
        console.error('Failed to load stats:', e);
      }
    }
    loadStats();

    // Handle Upload
    document.getElementById('uploadForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const btn = document.getElementById('submitBtn');
      const result = document.getElementById('result');
      const formData = new FormData(e.target);

      btn.disabled = true;
      btn.textContent = '⏳ Mengirim...';
      result.className = 'result';

      try {
        const res = await fetch('/api/upload', { method: 'POST', body: formData });
        const data = await res.json();

        if (data.success) {
          result.className = 'result success';
          result.textContent = `✅ ${data.message} (${data.successCount} sukses, ${data.failCount} gagal)`;
          e.target.reset();
        } else {
          result.className = 'result error';
          result.textContent = `❌ Error: ${data.error}`;
        }
      } catch (err) {
        result.className = 'result error';
        result.textContent = `❌ Error: ${err.message}`;
      }

      btn.disabled = false;
      btn.textContent = '🚀 KIRIM KE SEMUA USER';
    });

    // Handle Users/Groups List
    async function loadUsersList() {
      try {
        const res = await fetch('/api/users');
        const data = await res.json();
        
        const userList = document.getElementById('userList');
        const groupList = document.getElementById('groupList');

        if (data.users && data.users.length > 0) {
          userList.innerHTML = data.users.map(u => \`
            <div class="list-item \${u.blocked ? 'blocked' : ''}">
              <div class="item-info">
                <span class="item-name">\${u.name} (@\${u.username})</span>
                <span class="item-meta">ID: \${u.id} \${u.blocked ? '• ⛔ DIBLOKIR' : ''}</span>
              </div>
              <button class="btn-action \${u.blocked ? 'unblock' : 'block'}" onclick="toggleBlock('\${u.id}', 'user', \${!u.blocked})">
                \${u.blocked ? 'Buka Blokir' : 'Blokir'}
              </button>
            </div>
          \`).join('');
        } else {
          userList.innerHTML = '<div style="padding:15px;text-align:center;color:#666;">Belum ada user terdaftar.</div>';
        }

        if (data.groups && data.groups.length > 0) {
          groupList.innerHTML = data.groups.map(g => \`
            <div class="list-item \${g.blocked ? 'blocked' : ''}">
              <div class="item-info">
                <span class="item-name">\${g.title}</span>
                <span class="item-meta">ID: \${g.id} \${g.blocked ? '• ⛔ DIBLOKIR' : ''}</span>
              </div>
              <button class="btn-action \${g.blocked ? 'unblock' : 'block'}" onclick="toggleBlock('\${g.id}', 'group', \${!g.blocked})">
                \${g.blocked ? 'Buka Blokir' : 'Blokir'}
              </button>
            </div>
          \`).join('');
        } else {
          groupList.innerHTML = '<div style="padding:15px;text-align:center;color:#666;">Belum ada grup terdaftar.</div>';
        }

      } catch (e) {
        console.error(e);
        document.getElementById('userList').innerHTML = 'Gagal memuat data.';
        document.getElementById('groupList').innerHTML = 'Gagal memuat data.';
      }
    }

    async function toggleBlock(id, type, block) {
      if (!confirm(\`Yakin ingin \${block ? 'memblokir' : 'membuka blokir'} \${type} ini?\`)) return;
      
      try {
        const res = await fetch('/api/users', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id, type, action: block ? 'block' : 'unblock' })
        });
        const result = await res.json();
        if (result.success) {
          loadUsersList(); // reload list
          loadStats(); // reload stats
        } else {
          alert('Error: ' + result.error);
        }
      } catch (e) {
        alert('Gagal menghubungi server.');
      }
    }
  </script>
</body>
</html>
